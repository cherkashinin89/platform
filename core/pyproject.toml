[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core"
version = "0.1.0"
description = "Общий пакет экосистемы platform (framework + cloud + mail)"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "Flask-SQLAlchemy>=3.1",
    "Flask-Login>=0.6",
    "Flask-WTF>=1.2",
    "Flask-Migrate>=4.0",
    "Pillow>=11.0",
    "psutil>=5.9",
    "python-dotenv>=1.0",
    "email_validator>=2.1",
]

[tool.setuptools]
packages = ["core"]
package-dir = {"core" = "."}

[tool.setuptools.package-data]
core = [
    "templates/**/*.html",
    "static/**/*.css",
    "static/**/*.js",
    "static/**/*.woff",
    "static/**/*.woff2",
]