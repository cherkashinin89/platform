<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ссылка недействительна — MyCloud</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #f8f9fa; min-height: 100vh; margin: 0;
               display: flex; align-items: center; justify-content: center; }
        .box { text-align: center; padding: 60px 40px; background: white;
               border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
               max-width: 500px; }
        .box .icon { font-size: 5rem; margin-bottom: 16px; }
        .box h1 { color: #212529; margin: 0 0 12px 0; font-size: 1.5rem; }
        .box p { color: #6c757d; margin: 0 0 24px 0; line-height: 1.5; }
        .box a { display: inline-block; background: #fd7e14; color: white;
                 padding: 12px 28px; border-radius: 8px; text-decoration: none;
                 font-weight: 500; }
        .box a:hover { background: #e8590c; color: white; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🔒</div>
        <h1>Ссылка недействительна</h1>
        <p>Возможно, она была отозвана владельцем, истекла или никогда не существовала.</p>
        <a href="{{ site_settings.cloud_base_url }}">Перейти в MyCloud</a>
    </div>
</body>
</html>
