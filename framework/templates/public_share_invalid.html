{% extends 'base.html' %}

{% block title %}Ссылка недействительна{% endblock %}

{% block content %}

    <h1 class="mt-3">Ссылка недействительна</h1>
    <p class="text-muted">Возможно, ссылка устарела, была отозвана или файл удалён.</p>

        <i class="bi bi-house"></i> На главную
    </a>
</div>
{% endblock %}
