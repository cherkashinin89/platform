{% extends 'base.html' %}

{% block title %}Пароль для ссылки{% endblock %}

{% block content %}
<div class="text-center py-5" style="max-width: 420px; margin: 0 auto;">
    <i class="bi bi-shield-lock" style="font-size: 4rem; color: var(--color-text-muted);"></i>
    <h1 class="mt-3">Ссылка защищена паролем</h1>
    <p class="text-muted">Введите пароль, чтобы открыть файл.</p>

    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('public_share_auth', token=token) }}" class="mt-3">
        <input type="password" name="password" class="form-control" placeholder="Пароль"
               required autofocus style="margin-bottom: 12px;">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-unlock"></i> Открыть
        </button>
    </form>
</div>
{% endblock %}
