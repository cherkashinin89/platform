{% extends 'base.html' %}

{% block title %}Главная — {{ site_settings.site_title if site_settings else 'Мой Сайт' }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-house-door"
       style="font-size: 5rem; color: var(--color-primary); opacity: 0.4;"></i>
    <h2 class="mt-4">Добро пожаловать!</h2>
    <p class="text-muted" style="max-width: 500px; margin: 12px auto;">
        Здесь скоро появится главная страница с обзором.
    </p>
    <p class="text-muted">
        А пока — переходите в
        <a href="{{ url_for('articles_list') }}">Статьи</a>
        или <a href="{{ url_for('gallery_index') }}">Галерею</a>.
    </p>
</div>
{% endblock %}
