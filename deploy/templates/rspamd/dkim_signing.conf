# ============================================================
# Rspamd: DKIM-подпись исходящих писем
# ============================================================

# Включить подпись
enabled = true;

# Домены, которые подписываем — берём из БД (mail_domain)
# Пока — статически, для теста
# domain {
#   testprod2.local {
#     path = "/var/lib/rspamd/dkim/testprod2.local.default.key";
#     selector = "default";
#   }
# }

# Автогенерация ключей (при первом использовании)
allow_username_mismatch = true;

# Путь к ключам
path = "/var/lib/rspamd/dkim/$domain.$selector.key";
selector = "default";

# Подписывать только исходящие (от нас)
sign_authenticated = true;
sign_local = true;
