server {
    listen 5001;
    server_name _;

    client_max_body_size 500M;

    access_log /var/log/nginx/cloud_access.log;
    error_log  /var/log/nginx/cloud_error.log;

    # Общие статики из core (Bootstrap, иконки, style.css, темы)
    location /static/shared/ {
        alias /home/deploy/apps/platform/core/static/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Собственные статики cloud
    location /static/ {
        alias /home/deploy/apps/platform/cloud/static/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Всё остальное — на Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
