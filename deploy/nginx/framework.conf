server {
    listen 80;
    server_name _;

    client_max_body_size 200M;

    access_log /var/log/nginx/framework_access.log;
    error_log  /var/log/nginx/framework_error.log;

    # Общие статики из core (Bootstrap, иконки, style.css, темы)
    # Framework использует их через /static/shared/
    location /static/shared/ {
        alias /home/deploy/apps/platform/core/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Собственные статики framework (TinyMCE, sortable, css, themes)
    location /static/ {
        alias /home/deploy/apps/platform/framework/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Загруженные системные файлы (лого, favicon)
    location /uploads/ {
        alias /home/deploy/apps/platform/framework/uploads/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Всё остальное — на Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
