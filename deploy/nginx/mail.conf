server {
    listen 5003;
    server_name _;

    client_max_body_size 50M;

    access_log /var/log/nginx/mail_access.log;
    error_log  /var/log/nginx/mail_error.log;

    # Общие статики из core (Bootstrap, иконки, style.css, темы)
    location /static/shared/ {
        alias /home/deploy/apps/platform/core/static/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Собственные статики mail
    location /static/ {
        alias /home/deploy/apps/platform/mail/static/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Всё остальное — на Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}